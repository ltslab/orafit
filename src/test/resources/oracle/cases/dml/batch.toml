version = 1
feature = "jdbc-batch-failure-semantics"

[[case]]
id = "batch.all-succeed"
title = "Every row of a batch is stored"
kind = "update"
compare = "update"
sql = """
INSERT INTO bs_dml (id, code, amount, note) VALUES (?, ?, ?, ?)
"""
observe_sql = """
SELECT id, code, amount, note FROM bs_dml ORDER BY id
"""
batch = [["10", "X", "1.5", "a"], ["11", "Y", "2.5", "b"], ["12", "Z", "3.5", "c"]]
[[case.bind]]
mode = "in"
index = 1
type = "INTEGER"
value = "0"
[[case.bind]]
mode = "in"
index = 2
type = "VARCHAR"
value = "0"
[[case.bind]]
mode = "in"
index = 3
type = "DECIMAL"
value = "0"
[[case.bind]]
mode = "in"
index = 4
type = "VARCHAR"
value = "0"

[case.oracle]
outcome = "success"

[case.orafit]
mode = "same"

