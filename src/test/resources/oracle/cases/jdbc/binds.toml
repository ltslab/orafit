version = 1
feature = "binds"

[[case]]
id = "bind.concat-function"
title = "VARCHAR bind in Oracle CONCAT function"
kind = "query"
compare = "ordered"
sql = """
SELECT CONCAT(?, '%') AS value FROM dual
"""
[case.oracle]
outcome = "success"
[case.orafit]
mode = "same"
[[case.bind]]
index = 1
type = "VARCHAR"
mode = "in"
value = "abc"

