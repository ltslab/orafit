[[case]]
id = "scalar.cast-number-varchar2-too-long"
title = "CAST of a number longer than the VARCHAR2 is an error"
kind = "query"
compare = "error"
sql = """
SELECT CAST(12345 AS VARCHAR2(2)) AS value FROM dual
"""
[case.oracle]
outcome = "error"
error_code = 25137
[case.orafit]
mode = "same"

