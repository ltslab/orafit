version = 1
feature = "cast-number-text-bitand"

[[case]]
id = "scalar.cast-number-column-varchar2"
title = "CAST of a NUMBER column to VARCHAR2 drops trailing zeros"
kind = "query"
compare = "ordered"
sql = """
SELECT empno, CAST(sal AS VARCHAR2(20)) AS value FROM bs_emp ORDER BY empno
"""
[case.oracle]
outcome = "success"
[case.orafit]
mode = "same"

[[case]]
id = "scalar.cast-fraction-varchar2"
title = "CAST of a fraction to VARCHAR2 has no leading zero"
kind = "query"
compare = "ordered"
sql = """
SELECT CAST(0.5 AS VARCHAR2(10)) AS value FROM dual
"""
[case.oracle]
outcome = "success"
[case.orafit]
mode = "same"

[[case]]
id = "scalar.cast-number-arithmetic-varchar2"
title = "CAST of NUMBER arithmetic to VARCHAR2"
kind = "query"
compare = "ordered"
sql = """
SELECT empno, CAST(sal / 8 AS VARCHAR2(40)) AS value FROM bs_emp ORDER BY empno
"""
[case.oracle]
outcome = "success"
[case.orafit]
mode = "same"

[[case]]
id = "scalar.cast-text-column-varchar2"
title = "CAST of a text column to VARCHAR2 is unchanged"
kind = "query"
compare = "ordered"
sql = """
SELECT empno, CAST(ename AS VARCHAR2(10)) AS value FROM bs_emp ORDER BY empno
"""
[case.oracle]
outcome = "success"
[case.orafit]
mode = "same"

