version = 1
feature = "date-bind-expression"

[[case]]
id = "date-bind.trunc"
title = "TRUNC of a TIMESTAMP bind"
kind = "query"
compare = "ordered"
sql = """
SELECT TRUNC(?) AS value FROM dual
"""
[[case.bind]]
mode = "in"
index = 1
type = "TIMESTAMP"
value = "2026-01-31 08:00:00"
[case.oracle]
outcome = "success"
[case.orafit]
mode = "same"

